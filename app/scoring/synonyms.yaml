# Skill vocabulary for the deterministic ATS score.
#
# Each entry is a canonical skill name (shown in the UI) with:
#   aliases  - phrases that count as this skill. Case-insensitive. Spaces and
#              hyphens are interchangeable ("real time" == "real-time").
#              The canonical name is NOT added automatically; list it if it
#              should match.
#   implies  - (optional) having this skill in the CV counts as an implied,
#              partial match for these skills. Directional: TCP/IP implies
#              Networking, not the other way round.
#   strict   - (optional) short or ambiguous aliases. Stricter word boundaries:
#              no hyphen, apostrophe or dot right next to the alias.
#
# Ambiguous words that would cause false matches are left out on purpose:
# bare "go", "make", "rest", "ts", "ips", "networks" (neural networks), "crypto".
#
# Adding a skill here changes scores, so the deterministic score is only
# reproducible for the same version of this file.

skills:
