[project]
name = "job-tracker"
version = "0.2.0"
description = "Local job-search tracker with ATS scoring and follow-up reminders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy==2.1.4",
    "alembic==1.20.0",
    "Jinja2==3.1.6",
    "python-multipart==0.0.32",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "pdfplumber==0.11.10",
    "python-docx==1.2.0",
    "PyYAML==6.0.3",
    "tzdata==2026.5",
    "anthropic==1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",  # transport for Starlette's TestClient
    "reportlab==5.0.1",  # only used by tests to build sample PDFs
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["scoring/synonyms.yaml", "web/templates/**/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
